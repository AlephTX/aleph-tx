# Scenario 1 (Quant Profit) — Isolated Lighter ETH 0-bps Maker Profile Template
# Copy to a private local config and supply credentials via an isolated .env file.
# Never commit live credentials, private account IDs, or session journals.

strategy_mode = "quant"

[deployment]
scenario = "quant_profit"
l1_group = "primary_l1"
subaccount_slot = "sub_eth_quant"
# Optional: set expected_account_index to pin this profile to a specific Lighter subaccount.

[symbols]
BTC = 1001
ETH = 1002

[lighter]
feeder_enabled = true
feeder_ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
feeder_symbols = { ETH = "0" }
exchange_id = 2

[hyperliquid]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { ETH = "ETH", BTC = "BTC" }
exchange_id = 1
symbol_id = 1002
risk_fraction = 0.20
min_spread_bps = 5.0
vol_multiplier = 2.5
stop_loss_pct = 0.005
requote_interval_ms = 2000

[binance]
feeder_enabled = true
feeder_ws_url = "wss://fstream.binance.com"
feeder_symbols = { ETH = "ETHUSDT", BTC = "BTCUSDT" }

[edgex]
feeder_enabled = false
feeder_ws_url = "wss://quote.edgex.exchange/api/v1/public/ws"
feeder_rest_url = "https://pro.edgex.exchange"
feeder_symbols = { ETH = "10000002", BTC = "10000001" }
risk_fraction = 0.10
min_spread_bps = 8.0
vol_multiplier = 3.0
stop_loss_pct = 0.005
requote_interval_ms = 5000

[backpack]
feeder_enabled = false
feeder_ws_url = "wss://ws.backpack.exchange"
feeder_symbols = { ETH = "ETH_USDC_PERP", BTC = "BTC_USDC_PERP" }
risk_fraction = 0.20
min_spread_bps = 6.0
vol_multiplier = 2.5
stop_loss_pct = 0.005
requote_interval_ms = 3000

[inventory_neutral_mm]
exchange_id = 2
symbol_id = 1002
market_id = 0
tick_size = 0.01
step_size = 0.0001

maker_fee_bps = 0.0
min_profit_bps = 0.8
max_spread_bps = 15.0

penny_ticks = 1.0
inventory_skew_bps = 3.5

base_order_size = 0.02
max_position = 0.15
inventory_urgency_threshold = 0.06

adverse_selection_threshold = 2.0
requote_threshold_bps = 1.8
order_ttl_secs = 20
max_leverage = 5.0
min_available_balance = 20.0
max_daily_loss_pct = 0.05
use_post_only = true
poll_interval_ms = 250
min_cycle_interval_ms = 50

grid_levels = 1
sigmoid_steepness = 1.5
flattening_cap_mult = 2.5

micro_samples = 200
ema_fast_period = 5
ema_slow_period = 20
use_depth_pricing = true
vol_spread_scale = 0.5
momentum_skew_scale = 0.3
