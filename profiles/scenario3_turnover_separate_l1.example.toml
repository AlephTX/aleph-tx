# Scenario 3 (Incentive Turnover) — Isolated Robinhood Chain Zero-Fee Maker Turnover Template
# Targets Lighter Robinhood Chain (`wss://api.rh.lighter.xyz/stream`, `chain_id = 466324`),
# a distinct orderbook/domain from Scenario 1 (`CoreMainnet ETH`), with an independent
# capital, loss, and turnover ledger (`l1_group = "turnover_l1"`).
# NOTE: Lighter native STP is single-account only (not cross-subaccount), and Lighter Terms &
# Points rules prohibit wash/self-trading across ALL commonly-controlled accounts regardless of
# L1 wallet. Never run two operator-controlled profiles on the same `(domain, market_id)`.

strategy_mode = "quant"

[deployment]
scenario = "incentive_turnover"
l1_group = "turnover_l1"
subaccount_slot = "sub_eth_rh_turnover"

[symbols]
BTC = 1001
ETH = 1002

[lighter]
feeder_enabled = true
feeder_ws_url = "wss://api.rh.lighter.xyz/stream"
feeder_symbols = { ETH = "0" }
exchange_id = 2

[hyperliquid]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { ETH = "ETH", BTC = "BTC" }
exchange_id = 1
symbol_id = 1002
risk_fraction = 0.20
min_spread_bps = 5.0
vol_multiplier = 2.5
stop_loss_pct = 0.005
requote_interval_ms = 2000

[binance]
feeder_enabled = true
feeder_ws_url = "wss://fstream.binance.com"
feeder_symbols = { ETH = "ETHUSDT", BTC = "BTCUSDT" }

[inventory_neutral_mm]
exchange_id = 2
symbol_id = 1002
market_id = 0
tick_size = 0.01
step_size = 0.0001

maker_fee_bps = 0.0
min_profit_bps = 0.3
max_spread_bps = 12.0

penny_ticks = 0.0
inventory_skew_bps = 4.0

base_order_size = 0.03
max_position = 0.12
inventory_urgency_threshold = 0.04

adverse_selection_threshold = 1.8
requote_threshold_bps = 1.5
order_ttl_secs = 25
max_leverage = 5.0
min_available_balance = 20.0
max_daily_loss_pct = 0.02
use_post_only = true
poll_interval_ms = 250
min_cycle_interval_ms = 50

grid_levels = 1
sigmoid_steepness = 1.8
flattening_cap_mult = 3.0

micro_samples = 200
ema_fast_period = 5
ema_slow_period = 20
use_depth_pricing = true
vol_spread_scale = 0.4
momentum_skew_scale = 0.3
