[package]
name = "aleph-tx"
version = "0.1.0"
edition = "2024"
description = "Institutional-grade quantitative trading system"

[features]
research-replay = ["tokio/test-util"]

[dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rmp-serde = "1"
k256 = "0.14"
hmac = "0.13"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = { version = "1", features = ["serde-float", "serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.13"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
memmap2 = "0.9"
sha3 = "0.12"
num-bigint = "0.5"
num-traits = "0.2"
ed25519-dalek = "3"
base64 = "0.23"
futures = "0.3"
toml = "1"
uuid = { version = "1", features = ["v4"] }
dotenv = "0.15"
flume = "0.12"
core_affinity = "0.8"
crossbeam = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1"

[dev-dependencies]
# Paused clock for deterministic async timing tests; no new crate.
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
name = "aleph_tx"
path = "src/lib.rs"

[[bin]]
name = "lighter_inventory_mm"
path = "src/bin/lighter_inventory_mm.rs"

[[bin]]
name = "maker_replay"
path = "src/bin/maker_replay.rs"
required-features = ["research-replay"]

[[bin]]
name = "arcus_xyz_basis"
path = "src/bin/arcus_xyz_basis.rs"

[profile.release]
lto = true
codegen-units = 1
