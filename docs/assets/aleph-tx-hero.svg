<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 336" role="img" aria-labelledby="title desc">
  <title id="title">AlephTX · Institutional Perpetual Execution &amp; Quantitative Lakehouse Engine</title>
  <desc id="desc">Sub-10ms Go/Rust shared-memory perpetual execution on oasis-tokyo, 24x7 rolling multi-venue capture, and 10-hour causal replay and post-trade attribution on the aleph lakehouse workstation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="55%" stop-color="#0a131c"/>
      <stop offset="100%" stop-color="#0b1d22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee6a8"/>
      <stop offset="50%" stop-color="#4dd7c0"/>
      <stop offset="100%" stop-color="#5ccfd3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#112229" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c181e" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#3ee6a8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3ee6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ccfd3" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5ccfd3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#6ab5ae" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1120" height="336" rx="22"/>
    </clipPath>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#3ee6a8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#5ccfd3"/>
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#f2b866"/>
    </marker>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1120" height="336" fill="url(#bg)"/>
    <rect width="1120" height="336" fill="url(#grid)"/>
    <rect width="1120" height="336" fill="url(#glowLeft)"/>
    <rect width="1120" height="336" fill="url(#glowRight)"/>
    <path d="M568 0V336" stroke="#1f3b42" stroke-width="1.2"/>
    <rect x="44" y="0" width="168" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.75" y="0.75" width="1118.5" height="334.5" rx="21.5" fill="none" stroke="#284850" stroke-width="1.5"/>

  <!-- Left Column: Brand & Core Engineering Specs -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="44" y="34" width="44" height="44" rx="11" fill="#0f2622" stroke="#2d6a56" stroke-width="1.5"/>
    <text x="66" y="65" text-anchor="middle" font-size="29" font-weight="700" fill="#3ee6a8">α</text>
    <rect x="102" y="39" width="388" height="34" rx="8" fill="#0d1d22" stroke="#214248"/>
    <circle cx="118" cy="56" r="4" fill="#3ee6a8"/>
    <text x="131" y="60" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#9ec8c2">QUANTITATIVE PERP EXECUTION &amp; LAKEHOUSE</text>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
