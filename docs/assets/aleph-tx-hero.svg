    <g fill="url(#cardGrad)" stroke="#2c5b6c" stroke-width="1.2">
      <rect x="594" y="148" width="150" height="54" rx="8"/>
      <rect x="766" y="148" width="150" height="54" rx="8"/>
      <rect x="938" y="148" width="150" height="54" rx="8"/>
    </g>
    <g fill="none" stroke="#5ccfd3" stroke-width="1.5" marker-end="url(#arrowCyan)">
      <path d="M746 175H761"/>
      <path d="M918 175H933"/>
    </g>
    <g text-anchor="middle">
      <text x="669" y="171" font-size="13" font-weight="700" fill="#e9f7f4">3-Stream Capture</text>
      <text x="669" y="189" font-size="10.5" fill="#8ab5af">Crypto · RWA · BULK</text>
      <text x="841" y="171" font-size="13" font-weight="700" fill="#e9f7f4">VDSO &lt;25µs Seal</text>
      <text x="841" y="189" font-size="10.5" fill="#8ab5af">10h15m Rolling Units</text>
      <text x="1013" y="171" font-size="13" font-weight="700" fill="#e9f7f4">20TB Lakehouse</text>
      <text x="1013" y="189" font-size="10.5" fill="#8ab5af">SCHED_IDLE Zero-Egress</text>
    </g>

    <!-- Plane 03 -->
    <text x="594" y="238" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#f2b866">03 / CAUSAL BACKTEST &amp; POST-TRADE ATTRIBUTION (ALEPH)</text>
    <g fill="url(#cardGrad)" stroke="#635133" stroke-width="1.2">
      <rect x="594" y="248" width="150" height="54" rx="8"/>
      <rect x="766" y="248" width="150" height="54" rx="8"/>
      <rect x="938" y="248" width="150" height="54" rx="8"/>
    </g>
    <g fill="none" stroke="#f2b866" stroke-width="1.5" marker-end="url(#arrowAmber)">
      <path d="M746 275H761"/>
      <path d="M918 275H933"/>
    </g>
    <g text-anchor="middle">
      <text x="669" y="271" font-size="13" font-weight="700" fill="#e9f7f4">Silver Parquet</text>
      <text x="669" y="289" font-size="10.5" fill="#c7b597">3-Tier NVMe + DuckDB</text>
      <text x="841" y="271" font-size="13" font-weight="700" fill="#e9f7f4">Causal Compiler</text>
      <text x="841" y="289" font-size="10.5" fill="#c7b597">ASOF Join · GPU ML</text>
      <text x="1013" y="271" font-size="13" font-weight="700" fill="#e9f7f4">3 Track Ledgers</text>
      <text x="1013" y="289" font-size="10.5" fill="#c7b597">Quant · Arb · Turnover</text>
