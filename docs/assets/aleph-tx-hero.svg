    <text x="594" y="38" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#3ee6a8">01 / SUPERVISED LOW-LATENCY EXECUTION (OASIS-TOKYO)</text>
    <g fill="url(#cardGrad)" stroke="#2d6359" stroke-width="1.2">
      <rect x="594" y="48" width="150" height="54" rx="8"/>
      <rect x="766" y="48" width="150" height="54" rx="8"/>
      <rect x="938" y="48" width="150" height="54" rx="8"/>
    </g>
    <g fill="none" stroke="#3ee6a8" stroke-width="1.5" marker-end="url(#arrowGreen)">
      <path d="M746 75H761"/>
      <path d="M918 75H933"/>
    </g>
    <g text-anchor="middle">
      <text x="669" y="71" font-size="13" font-weight="700" fill="#e9f7f4">Go Feeder</text>
