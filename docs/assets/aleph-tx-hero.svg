      <text x="841" y="71" font-size="13" font-weight="700" fill="#e9f7f4">Lock-Free SHM</text>
      <text x="841" y="89" font-size="10.5" fill="#8ab5af">Matrix + Top-5 Depth</text>
      <text x="1013" y="71" font-size="13" font-weight="700" fill="#e9f7f4">Rust Executor</text>
      <text x="1013" y="89" font-size="10.5" fill="#8ab5af">MM · IOC · WAL Guard</text>
