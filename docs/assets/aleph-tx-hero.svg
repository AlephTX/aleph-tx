    <circle cx="58" cy="260" r="3.5" fill="#3ee6a8"/>
    <text x="69" y="264" fill="#b7dcd6">12-SLOT SHM ABI (64B / 256B)</text>

    <rect x="290" y="246" width="248" height="28" rx="6" fill="#0e2024" stroke="#264b50"/>
    <circle cx="304" cy="260" r="3.5" fill="#3ee6a8"/>
    <text x="315" y="264" fill="#b7dcd6">TOKYO &lt;10MS · 3-LANE SIGNER</text>

    <rect x="44" y="282" width="236" height="28" rx="6" fill="#0e2024" stroke="#264b50"/>
    <circle cx="58" cy="296" r="3.5" fill="#5ccfd3"/>
