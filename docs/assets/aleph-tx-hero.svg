    <text x="46" y="196" font-size="19.5" font-weight="500" fill="#c7e0dc">Sub-10ms Multi-Venue CLOB Execution · Causal Research Engine</text>
    <text x="46" y="222" font-size="14" font-weight="400" fill="#82a8a4">Lighter Core &amp; Robinhood · Arcus · Entropy · TradeXYZ · Hyperliquid · Extended · BULK</text>
  </g>

