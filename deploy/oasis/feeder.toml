# Global SHM symbol IDs shared with Rust strategies and Python monitor (1..2047).
[symbols]
BTC = 1001
ETH = 1002
NVDA = 1003
SNDK = 1004

# Lighter SHM account position is single-market (feeder_symbols); extra public
# reference markets subscribe via feeder_public_symbols.
[lighter]
feeder_enabled = true
feeder_ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
feeder_symbols = { ETH = "0" }
feeder_public_symbols = { BTC = "1" }

[lighter_robinhood]
feeder_enabled = true
feeder_ws_url = "wss://api.rh.lighter.xyz/stream"
feeder_symbols = { ETH = "0", BTC = "1" }

[hyperliquid]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { ETH = "ETH", BTC = "BTC" }

[entropy]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { NVDA = "io:NVDA", SNDK = "io:SNDK" }

[tradexyz]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { NVDA = "xyz:NVDA", SNDK = "xyz:SNDK" }

[arcus]
feeder_enabled = true
feeder_ws_url = "wss://api.arcus.xyz/v1/ws"
feeder_symbols = { BTC = "BTC-USD", ETH = "ETH-USD", NVDA = "NVDA-USD", SNDK = "SNDK-USD" }

[binance]
feeder_enabled = true
feeder_ws_url = "wss://fstream.binance.com"
feeder_symbols = { ETH = "ETHUSDT", BTC = "BTCUSDT" }
