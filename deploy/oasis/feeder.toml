# Lighter SHM account position is single-market; switch ETH = "0" to BTC = "1" for BTC sessions.
[lighter]
feeder_enabled = true
feeder_ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
feeder_symbols = { ETH = "0" }

[hyperliquid]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { ETH = "ETH", BTC = "BTC" }

[binance]
feeder_enabled = true
feeder_ws_url = "wss://fstream.binance.com"
feeder_symbols = { ETH = "ETHUSDT", BTC = "BTCUSDT" }
