# systemd-tmpfiles: the live strategy (aleph-tx-trader) appends JSONL telemetry here;
# setgid keeps new files in group aleph-tx so the monitor can read (never write) them.
d /var/lib/aleph-tx-telemetry 2750 aleph-tx-trader aleph-tx -
# 24/7 rolling public market captures (physically isolated by liquidity/session domain).
d /var/lib/aleph-tx-captures 0755 aleph-tx aleph-tx -
d /var/lib/aleph-tx-captures/crypto 0755 aleph-tx aleph-tx -
d /var/lib/aleph-tx-captures/rwa 0755 aleph-tx aleph-tx -
d /var/lib/aleph-tx-captures/bulk 0755 aleph-tx aleph-tx -
d /var/lib/aleph-tx-captures/quarantine 0755 aleph-tx aleph-tx -
