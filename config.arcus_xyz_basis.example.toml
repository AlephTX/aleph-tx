# Dedicate Arcus ANT-USD <-> Hyperliquid xyz:ANT Basis Arbitrage Canary Profile (`Step 1–Step 3`)
# Synthetic example only: keep `dry_run = true` for `--check` and `--shadow`.
# Only set `dry_run = false` on the live host AFTER Monday RTH Step 2 Gate passes
# AND you explicitly pass `--canary --confirm-live-canary`.

network = "mainnet"
arcus_symbol = "ANT-USD"
hl_dex = "xyz"
hl_coin = "xyz:ANT"

# Pre-registered EXP-ARB-A2 + Leung-Li parameters (ZERO post-freeze tweaking)
entry_bp = 10.0
exit_bp = 0.0
max_entry_bp = 35.0
persist_ms = 100
post_trade_refresh_lock = true

# Tight Canary sizing caps ($50 single clip, $100 max inventory)
clip_usd = 50.0
max_notional_usd = 100.0
ladder_floor_frac = 0.25
ladder_scale_bps = 2.0
ladder_convex_power = 1.0

max_hold_ms = 7200000
max_arcus_book_age_ms = 250
max_hl_book_age_ms = 5000
slippage_bps = 8.0

# CRASH-IMP-01 real-time progressive drawdown brake anchored at 5% of allocated Canary capital
allocated_capital_usd = 500.0
daily_loss_limit_pct = 0.05
canary_max_order_usd = 50.0
canary_max_total_notional_usd = 100.0

require_arcus_cancel_lease = true
require_hl_growth_mode = true
max_hl_deployer_fee_scale = 1.0
max_oracle_divergence_bps = 25.0
# Maximum oracle staleness (local receipt - oracle source) before NEW entries are blocked
# (reduce/close stay open). Must be >= poll_interval_ms.
max_oracle_age_ms = 2000
dry_run = true
# poll_interval_ms must be <= adl_delta_breaker.halt_sla_ms (see that section) so the ADL
# reduce-only response tier is reachable rather than skipped straight to halt.
poll_interval_ms = 100
account_refresh_interval_ms = 1000

journal_path = "state/arcus_xyz_basis_journal.ndjson"
daily_loss_state_path = "state/arcus_xyz_basis_daily_loss.json"

# ARB-IMP-09 per-venue sliding order budget & 429 cooldown/halt guard.
# Risk-reducing exits, emergency hedges, and cancels are always exempt from caps, cooldowns, and halts.
[order_budget]
window_ms = 60000
max_weight_per_window = 60
entry_soft_cap_pct = 80
cooldown_ms_on_rate_limit = 15000
max_consecutive_rate_limits_before_halt = 5

# ARB-IMP-10 cross-venue tail-risk supervisor on authoritative reported HL margin & liquidation distance.
# Triggers ReduceOnly (blocks new entries while allowing exits/hedges) or HaltAndFlatten conservatively.
[tail_risk]
reduce_only_margin_util = 0.70
halt_margin_util = 0.85
min_liq_buffer_bps = 300.0
halt_liq_buffer_bps = 120.0
max_venue_equity_imbalance_ratio = 0.75
depeg_reduce_only_bps = 30.0
depeg_halt_bps = 75.0
max_peg_age_ms = 60000
max_future_skew_ms = 5000

# Emergency ADL delta-neutrality circuit breaker (>1% unplanned leg mismatch -> reduce-only,
# sustained breach -> halt). SLAs MUST be consistent with the observation cadence: the residual
# is re-observed at most once per poll_interval_ms (account-sourced ADL can lag a further
# account_refresh_interval_ms), so config load fails unless halt_sla_ms >= poll_interval_ms.
# With poll_interval_ms = 100 the response (100ms) and halt (200ms) tiers are both reachable.
# A genuine sub-100ms reduce-only response would require a faster private-event inner loop that
# is NOT wired here; do not shorten these below the poll interval. See ARCUS_XYZ_BASIS_RUNBOOK.md.
[adl_delta_breaker]
max_unplanned_delta_ratio = 0.01
dust_base = 0.000001
response_sla_ms = 100
halt_sla_ms = 200

# Optional adaptive Kalman / Ornstein-Uhlenbeck basis filter (enable only for research / promoted profiles).
# [kalman_basis]
