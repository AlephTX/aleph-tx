# min_dislocation_bps = 3.0
# max_dislocation_bps = 30.0
# time_stop_half_life_mult = 3.0
# max_hold_ms_cap = 300000

# Optional low-latency shared-memory book feed (slots 7 = Arcus, 10 = TradeXYZ; auto-falls back to REST).
# [shm_book_feed]
# enabled = false
# bbo_shm_path = "/dev/shm/aleph-matrix"
