# feeder_symbols = { NVDA = "xyz:NVDA" }

# ============================================================================
# Inventory-Neutral MM Strategy (Lighter DEX)
# ============================================================================
[inventory_neutral_mm]
# Exchange identifiers
exchange_id = 2          # Lighter
symbol_id = 1002         # ETH-PERP
market_id = 0
tick_size = 0.01
step_size = 0.0001

# Fees
maker_fee_bps = 0.38
min_profit_bps = 1.0

# Quoting
penny_ticks = 1.0
inventory_skew_bps = 3.0

# Position management
base_order_size = 0.02
max_position = 0.20
inventory_urgency_threshold = 0.08

# Risk control
adverse_selection_threshold = 2.0
requote_threshold_bps = 2.0
order_ttl_secs = 10
max_leverage = 10.0
min_available_balance = 2.0
local_staleness_ms = 1000
stale_bbo_cancel_ms = 2500
require_external_fair_value = true
use_post_only = true
poll_interval_ms = 300

# Grid & Sigmoid
grid_levels = 1
sigmoid_steepness = 1.5
flattening_cap_mult = 2.0

# Microstructure (v4.0.0)
micro_samples = 200
ema_fast_period = 5
ema_slow_period = 20
use_depth_pricing = true
vol_spread_scale = 0.5
momentum_skew_scale = 0.3

# Optional Hyperliquid inventory hedge for make trade MODE=live.
# Review all limits and the account's actual taker fee before enabling this section.
# [inventory_hedge]
# max_unhedged_base = "0.02"       # absolute cap per leg and on net base exposure
# deadband_base = "0.006"          # residual tolerated during the session, in ETH
# max_order_notional_usd = "25"    # per IOC, evaluated at the book/limit price
# min_available_usd = "50"         # required Hyperliquid withdrawable balance
# slippage_bps = 5                 # IOC limit distance from executable touch
# taker_fee_bps = 4.5              # use the configured account's actual fee
