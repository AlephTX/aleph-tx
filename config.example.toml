# AlephTX Unified Configuration
# Copy to config.toml and adjust values
# Sensitive credentials (private keys, API keys) are stored in .env files

# Optional supervised mode. With this line omitted, [inventory_hedge] selects the mode.
# strategy_mode = "quant"  # Lighter only. Use "inventory_hedge" with [inventory_hedge].

# Global SHM symbol IDs shared by the Go feeder and Rust strategies (1..2047).
# Every ticker used in a feeder_symbols table must be listed here.
# Omitting this table keeps the historical defaults (BTC = 1001, ETH = 1002).
[symbols]
BTC = 1001
ETH = 1002

# ============================================================================
# Lighter DEX - Feeder
# ============================================================================
[lighter]
feeder_enabled = true
feeder_ws_url = "wss://mainnet.zklighter.elliot.ai/stream"
feeder_symbols = { ETH = "0" }
exchange_id = 2

# ============================================================================
# Hyperliquid - Feeder + Strategy
# ============================================================================
[hyperliquid]
feeder_enabled = true
feeder_ws_url = "wss://api.hyperliquid.xyz/ws"
feeder_symbols = { ETH = "ETH", BTC = "BTC" }

exchange_id = 1
symbol_id = 1002

risk_fraction = 0.20
min_spread_bps = 5.0
vol_multiplier = 2.5
stop_loss_pct = 0.005
requote_interval_ms = 2000
momentum_threshold_bps = 8.0
momentum_spread_mult = 2.0
vol_window = 120
balance_refresh_secs = 60

# ============================================================================
# Binance USD-M Futures - Public Reference BBO Feeder (Optional)
# ============================================================================
[binance]
feeder_enabled = false
feeder_ws_url = "wss://fstream.binance.com"
feeder_symbols = { ETH = "ETHUSDT", BTC = "BTCUSDT" }

# Optional multi-venue DEX/RWA public reference feeds (slots 7..10 in aleph-matrix):
# [arcus]
# feeder_enabled = false
# feeder_ws_url = "wss://api.arcus.xyz/v1/ws"
# feeder_symbols = { ETH = "ETH-USD", BTC = "BTC-USD" }
