# Track 03 (`03_incentive_turnover`) Shadow Configuration: Queue-Priority G4 Quiet-Session MM
#
# Frozen profile: `lighter AAPL G4_quiet_sessions_only`
# (see `docs/TRACK03_MULTIVENUE_TURNOVER_UPGRADE_2026_11_27.md` & `scripts/research_track03_multivenue_turnover.py`).
# Strictly isolated capital ($10,000) and daily loss budget (2%); read-only shadow/replay only.
#
# OPT-01 VERIFIED FEE-TIER PROVENANCE (Lighter Standard vs Premium):
#   - `lighter` (USDC, `user_tier=premium`, `custom_fee_override_detected=true`, ticks `40/280`):
#     Verified **`0.40 / 2.80 bps`** (maker / taker) with low latency (`140 ms` taker delay,
#     `0 ms` maker/cancel delay per `src/venues.rs`). Under `0.40 bps` maker fees, passive RWA
#     turnover flips NO-GO (`+$92.16/M` on `lighter AAPL G4_quiet_sessions_only`, `+$98.94/M`
#     aggregate RWA `G4_all_hours`).
#   - `lighter_robinhood` (USDG, `user_tier=standard`, `standard_zero_confirmed=true`, ticks `0/0`):
#     Verified **`0.00 / 0.00 bps`** maker/taker, carrying a `200 ms` maker/cancel speed bump
#     and `300 ms` taker/non-post-only delay (`~330 ms` exit delay incl. ~30 ms Tokyo RTT).
#   - This legacy `lighter` USDC profile keeps `0.0 / 0.0` placeholder values with
#     `account_fee_status = "public_tier0_unverified"` for offline regression parity only.
#   - For the `OPT-01` verified `0/0 bps` Standard shadow profile (`lighter_robinhood` USDG,
#     with `G5_microprice_tfi`, `ioc_exit_delay_ms = 330`, and `[defense]`), see
#     `examples/track03_lighter_rh_standard_shadow.toml`.
#   - `rebate_bps = 0.0` (never assume rebates without signed account verification).
#
# Exchange indices (`src/shm_reader.rs`): 2=Lighter, 7=Arcus, 8=LighterRH.
# Lighter market_id for AAPL = "113" (configured as SHM symbol_id = 1006 under `[symbols]`).

capital_usd = 10000.0
daily_loss_limit_pct = 0.02
allowlisted_symbols = ["AAPL"]

[[arms]]
symbol = "AAPL"
symbol_id = 1006
target_exchange_id = 2
ref_exchange_ids = [7]
maker_fee_bps = 0.0
taker_fee_bps = 0.0
rebate_bps = 0.0
queue_ahead_fraction = 0.5
# G4_quiet_sessions_only: admit overnight_asia (00:00-11:00 UTC), us_extended (11:00-13:30 / 20:00-24:00 UTC),
# and weekend UTC; suppress opening quotes during us_rth (13:30-20:00 UTC) while keeping reduce_only exits active.
allowed_utc_sessions = ["overnight_asia", "us_extended", "weekend"]
account_fee_status = "public_tier0_unverified"
# Verified Lighter Premium taker execution delay (~140 ms per src/venues.rs).
ioc_exit_delay_ms = 140

[arms.strategy]
tick_size = 0.01
lot_size = 0.01
